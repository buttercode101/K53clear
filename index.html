<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K53 Clear</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    :root { --bg:#0f1419; --surface:#1a1f26; --text:#e7e9ea; --muted:#8b98a5; --accent:#1d9bf0; --danger:#f4212e; --ok:#00ba7c; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; max-width: 680px; margin-inline: auto; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    .sub { color: var(--muted); margin-bottom: 16px; }
    .card { background: var(--surface); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    .label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
    .miss { color: var(--danger); }
    button, .opt { background: var(--surface); color: var(--text); border: 1px solid #333; border-radius: 8px; padding: 12px; font-weight: 600; width: 100%; margin-top: 8px; cursor: pointer; text-align: left; }
    button.primary { background: var(--accent); border: 0; color: #fff; text-align: center; }
    button.ok { background: var(--ok); border: 0; color: #fff; text-align: center; }
    .correct { border-color: var(--ok); }
    .wrong { border-color: var(--danger); }
    pre { background: #000; padding: 12px; border-radius: 8px; overflow: auto; font-size: 0.75rem; }
    #quiz { display: none; }
  </style>
</head>
<body>
  <h1>K53 Clear</h1>
  <p class="sub">Diagnostic, never predictive. No score until the data can support it.</p>

  <div id="readiness"></div>

  <div class="card">
    <div class="label">Study</div>
    <button class="primary" id="start-quiz">Start due session (seed families)</button>
    <button class="primary" id="start-mock">Start section mock (seed)</button>
    <button class="ok" id="share">Share delta card</button>
  </div>

  <div id="quiz" class="card"></div>

  <div class="card">
    <div class="label">Disagreement log (seed)</div>
    <pre id="log"></pre>
  </div>

  <script type="module">
    import { loadFamilies, pickVariant } from './src/content/loader.js';
    import { wilsonInterval, getReadinessState, shouldShowRange, PASS_LINES } from './src/engine/readiness.js';
    import { recordFamilyAttempt, getUniqueFamilies } from './src/storage/db.js';

    let families = [];
    let session = [];
    let idx = 0;
    let lastMisses = [];

    async function init() {
      families = await loadFamilies();
      const res = await fetch('./data/logs/disagreement-v1.json');
      document.getElementById('log').textContent = JSON.stringify(await res.json(), null, 2);
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
      await renderReadiness();
    }

    async function renderReadiness() {
      const signs = await getUniqueFamilies('signs');
      const rules = await getUniqueFamilies('rules');
      const controls = await getUniqueFamilies('controls');
      const container = document.getElementById('readiness');
      const sections = [
        { key: 'signs', count: signs, pass: PASS_LINES.signs },
        { key: 'rules', count: rules, pass: PASS_LINES.rules },
        { key: 'controls', count: controls, pass: PASS_LINES.controls }
      ];
      container.innerHTML = sections.map(s => {
        const state = getReadinessState(s.key, s.count, 0);
        let body = `<div class="miss">Not enough data (${s.count} unique families). Specific misses only.</div>`;
        if (state.state !== 'not-enough-data' && s.count > 0) {
          const interval = wilsonInterval(Math.round(s.count * 0.65), s.count);
          const straddles = shouldShowRange(interval, s.pass);
          const low = Math.round(interval.low * 100);
          const high = Math.round(interval.high * 100);
          body = straddles
            ? `<div class="miss">Range crosses the pass line — not enough data to call this<br>${low}–${high}%</div>`
            : `<div>${Math.round(interval.center * 100)}% (range ${low}–${high}%) — ${state.label}</div>`;
        }
        return `<div class="card"><div class="label">${s.key} · ${s.count} unique</div>${body}</div>`;
      }).join('');
    }

    function showQuestion() {
      const quiz = document.getElementById('quiz');
      if (idx >= session.length) {
        quiz.style.display = 'none';
        renderReadiness();
        return;
      }
      const item = session[idx];
      quiz.style.display = 'block';
      quiz.innerHTML = `
        <div class="label">${item.section} · ${idx + 1}/${session.length}</div>
        <p>${item.variant.question}</p>
        ${item.variant.options.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join('')}
      `;
      quiz.querySelectorAll('.opt').forEach(btn => {
        btn.onclick = async () => {
          const chosen = Number(btn.dataset.i);
          const correct = chosen === item.variant.answerIndex;
          btn.classList.add(correct ? 'correct' : 'wrong');
          if (!correct) lastMisses.push(item.familyId);
          await recordFamilyAttempt(item.familyId, item.section, correct);
          setTimeout(() => { idx++; showQuestion(); }, 600);
        };
      });
    }

    document.getElementById('start-quiz').onclick = () => {
      session = families.map(f => ({ familyId: f.familyId, section: f.section, variant: pickVariant(f) }));
      idx = 0;
      lastMisses = [];
      showQuestion();
    };

    document.getElementById('start-mock').onclick = () => {
      session = families.slice(0, 5).map(f => ({ familyId: f.familyId, section: f.section, variant: pickVariant(f) }));
      idx = 0;
      showQuestion();
    };

    document.getElementById('share').onclick = () => {
      const text = lastMisses.length
        ? `Before: missed ${lastMisses.slice(0, 2).join(', ')}\nAfter this session: reviewed the pairs\nNext: continue due families`
        : 'No misses this session. Keep going.';
      alert(text);
    };

    init();
  </script>
</body>
</html>
